[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "tellers-timeline"
version = "0.1.4"
description = "An OpenTimelineIO timeline engine with policy-driven editing, sync, sanitization, and effect conventions."
readme = "README.md"
requires-python = ">=3.8"
classifiers = ["Programming Language :: Python", "Programming Language :: Rust"]

[project.urls]
Documentation = "https://github.com/tellers-ai/tellers-timeline#make-your-first-edit"
Repository = "https://github.com/tellers-ai/tellers-timeline"
Issues = "https://github.com/tellers-ai/tellers-timeline/issues"

[tool.maturin]
include = ["python/**/*.pyi", "python/**/py.typed"]
features = ["pyo3/extension-module"]
python-source = "python"
